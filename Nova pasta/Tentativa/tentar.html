<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <section class="container mt-4">
        <h1 class="text-center mb-3">Agenda de Atividades</h1>
        <div class="card p-3">
            <input type="text" id="atividade" class="form-control mb-3" placeholder="Atividade">

        <select id="prioridade" class="form-select mb-3">
            <option value="alta">Importantíssimo</option>
            <option value="media">Importante</option>
            <option value="baixa">Posso deixar para depois</option>
        </select>

        <button class="btn btn-primary" onclick="adicionarAtividade()">Adicionar</button>
    </div>

    <div id="lista" class="mt-4"></div>
        </div>

    </section>

    <script>
        function adicionarAtividade() {
            let atividade = document.getElementById("atividade").value;
            let prioridade = document.getElementById("prioridade").value;
            let div = document.createElement("div");
            div.className = `card p-3 mb-2 ${prioridade}`;
            div.innerHTML = atividade;
            
            document.getElementById("lista").appendChild(div);

            document.getElementById("atividade").value = "";
        }
    </script>

    
    
    
</body>
</html>
