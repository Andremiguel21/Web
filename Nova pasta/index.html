<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Atividades</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .alta {
            border-left: 6px solid red;
        }

        .media {
            border-left: 6px solid yellow;
        }

        .baixa {
            border-left: 6px solid green;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Agenda de Atividades</h2>

    <div class="card p-4 shadow">
        <input type="text" id="atividade" class="form-control mb-3" placeholder="Digite a atividade">

        <select id="prioridade" class="form-select mb-3">
            <option value="alta">Alta prioridade</option>
            <option value="media">Média prioridade</option>
            <option value="baixa">Baixa prioridade</option>
        </select>

        <button class="btn btn-primary" onclick="adicionarAtividade()">Adicionar</button>
    </div>

    <div id="lista" class="mt-4"></div>
</div>

<script>
    function adicionarAtividade() {
        let atividade = document.getElementById("atividade").value;
        let prioridade = document.getElementById("prioridade").value;

        if (atividade === "") {
            alert("Digite uma atividade!");
            return;
        }

        let div = document.createElement("div");
        div.className = `card p-3 mb-2 ${prioridade}`;
        div.innerHTML = atividade;

        document.getElementById("lista").appendChild(div);

        document.getElementById("atividade").value = "";
    }
</script>

</body>
</html>
